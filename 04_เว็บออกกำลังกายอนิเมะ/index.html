    // --- Web Audio SFX Engine (ไม่ต้องพึ่งไฟล์ mp3 ภายนอก) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playSetComplete() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.2, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.25);
        });
      }
      playLevelUp() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.25, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.005, now + idx * 0.09 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.4);
        });
      }
      playTimerBeep() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1000, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
    }

    // --- Dynamic Anime Character Canvas Component ---
    function AnimeCharacterRenderer({ stage, level, exp, maxExp, isWorkingOut, workoutType, isLevelingUp }) {
      const canvasRef = useRef(null);

      // Evolution Stage Config
      const stageConfig = useMemo(() => {
        if (stage === 1) {
          return {
            rank: 'RANK: E - Novice Adventurer',
            bodyWidthScale: 1.0,
            muscleBulk: 1.0,
            shoulderWidth: 50,
            bicepSize: 10,
            absOpacity: 0.1,
            chestDefinition: 0.2,
            auraColor: null,
            hairColor: '#334155',
            eyeGlow: false,
            outfitColor: '#475569',
            titleColor: 'text-slate-400'
          };
        } else if (stage === 2) {
          return {
            rank: 'RANK: C - Martial Disciple',
            bodyWidthScale: 1.15,
            muscleBulk: 1.3,
            shoulderWidth: 65,
            bicepSize: 16,
            absOpacity: 0.5,
            chestDefinition: 0.6,
            auraColor: 'rgba(56, 189, 248, 0.3)',
            hairColor: '#0284c7',
            eyeGlow: false,
            outfitColor: '#1e293b',
            titleColor: 'text-cyan-400'
          };
        } else if (stage === 3) {
          return {
            rank: 'RANK: A - Calisthenics Berserker',
            bodyWidthScale: 1.35,
            muscleBulk: 1.7,
            shoulderWidth: 80,
            bicepSize: 22,
            absOpacity: 0.85,
            chestDefinition: 0.9,
            auraColor: 'rgba(192, 132, 252, 0.5)',
            hairColor: '#9333ea',
            eyeGlow: true,
            eyeColor: '#c084fc',
            outfitColor: '#0f172a',
            titleColor: 'text-purple-400'
          };
        } else {
          return {
            rank: 'RANK: S - Ascended Shadow Titan',
            bodyWidthScale: 1.55,
            muscleBulk: 2.1,
            shoulderWidth: 98,
            bicepSize: 28,
            absOpacity: 1.0,
            chestDefinition: 1.0,
            auraColor: 'rgba(251, 191, 36, 0.7)',
            hairColor: '#f59e0b',
            eyeGlow: true,
            eyeColor: '#fbbf24',
            lightning: true,
            outfitColor: '#000000',
            titleColor: 'text-amber-400'
          };
        }
      }, [stage]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let time = 0;

        // Particle system for aura
        const particles = Array.from({ length: stage >= 3 ? 35 : 15 }, () => ({
          x: Math.random() * 320,
          y: Math.random() * 450,
          radius: Math.random() * 3 + 1,
          speedY: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.7 + 0.2
        }));

        const render = () => {
          time += 0.05;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const centerX = canvas.width / 2;
          const centerY = 240;

          // 1. Draw Background Aura / Flame Effects
          if (stageConfig.auraColor) {
            ctx.save();
            const auraGrad = ctx.createRadialGradient(
              centerX, centerY - 20, 30,
              centerX, centerY - 20, 150 * (stageConfig.muscleBulk * 0.8)
            );
            auraGrad.addColorStop(0, stageConfig.auraColor);
            auraGrad.addColorStop(0.6, stage >= 4 ? 'rgba(192, 132, 252, 0.3)' : 'rgba(56, 189, 248, 0.1)');
            auraGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = auraGrad;
            ctx.beginPath();
            ctx.arc(centerX, centerY - 20, 160, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Rising Aura Particles
            particles.forEach(p => {
              p.y -= p.speedY;
              if (p.y < 50) {
                p.y = 420;
                p.x = centerX + (Math.random() - 0.5) * 160;
              }
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fillStyle = stage >= 4 ? `rgba(251, 191, 36, ${p.alpha})` : `rgba(56, 189, 248, ${p.alpha})`;
              ctx.shadowColor = stage >= 4 ? '#fbbf24' : '#38bdf8';
              ctx.shadowBlur = 8;
              ctx.fill();
              ctx.shadowBlur = 0;
            });
          }

          // Lightning Arcs for S-Rank
          if (stageConfig.lightning && Math.random() > 0.4) {
            ctx.save();
            ctx.strokeStyle = Math.random() > 0.5 ? '#fbbf24' : '#c084fc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            let lx = centerX + (Math.random() - 0.5) * 160;
            let ly = centerY - 100 + Math.random() * 200;
            ctx.moveTo(lx, ly);
            for (let i = 0; i < 4; i++) {
              lx += (Math.random() - 0.5) * 30;
              ly += (Math.random() - 0.5) * 30;
              ctx.lineTo(lx, ly);
            }
            ctx.stroke();
            ctx.restore();
          }

          // 2. Character Body Calculation (Breathing / Workout Animation)
          let breatheOffset = Math.sin(time) * 3;
          let workoutSquish = 0;

          if (isWorkingOut) {
            workoutSquish = Math.sin(time * 3) * 12; // Repetition animation
          }

          const headY = 90 + breatheOffset + (isWorkingOut ? workoutSquish * 0.5 : 0);
          const neckY = headY + 30;
          const torsoY = neckY + 15;
          const hipY = 250 + (isWorkingOut ? workoutSquish : 0);

          ctx.save();

          // Shadow under feet
          ctx.beginPath();
          ctx.ellipse(centerX, 420, 70 * stageConfig.bodyWidthScale, 15, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
          ctx.fill();

          // --- LEGS ---
          const legW = 16 * stageConfig.bodyWidthScale;
          const legSpacing = 28 * stageConfig.bodyWidthScale;
          // Left Leg
          ctx.fillStyle = stageConfig.outfitColor;
          ctx.beginPath();
          ctx.roundRect(centerX - legSpacing - legW / 2, hipY, legW, 160 - (isWorkingOut ? workoutSquish : 0), 8);
          ctx.fill();
          // Right Leg
          ctx.beginPath();
          ctx.roundRect(centerX + legSpacing - legW / 2, hipY, legW, 160 - (isWorkingOut ? workoutSquish : 0), 8);
          ctx.fill();

          // Boots
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.roundRect(centerX - legSpacing - legW / 2 - 2, 390, legW + 4, 30, 4);
          ctx.roundRect(centerX + legSpacing - legW / 2 - 2, 390, legW + 4, 30, 4);
          ctx.fill();

          // --- TORSO (V-Taper Anatomy) ---
          const shW = stageConfig.shoulderWidth;
          const waistW = 32 * (stageConfig.bodyWidthScale * 0.9);

          ctx.beginPath();
          ctx.moveTo(centerX - shW, torsoY);
          ctx.lineTo(centerX + shW, torsoY);
          ctx.lineTo(centerX + waistW, hipY);
          ctx.lineTo(centerX - waistW, hipY);
          ctx.closePath();

          // Torso Skin / Shirt Gradient
          const torsoGrad = ctx.createLinearGradient(centerX, torsoY, centerX, hipY);
          if (stage === 1) {
            torsoGrad.addColorStop(0, '#3b82f6');
            torsoGrad.addColorStop(1, '#1d4ed8');
          } else {
            // Ripped shirtless aesthetic
            torsoGrad.addColorStop(0, '#fbcfe8'); // Highlight skin tone
            torsoGrad.addColorStop(0.3, '#f5d0c5');
            torsoGrad.addColorStop(1, '#d4a373');
          }
          ctx.fillStyle = torsoGrad;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#27272a';
          ctx.stroke();

          // Chest (Pectorals) Definition
          if (stage >= 2) {
            ctx.save();
            ctx.strokeStyle = `rgba(120, 53, 15, ${stageConfig.chestDefinition})`;
            ctx.lineWidth = 2.5;
            // Left Pec
            ctx.beginPath();
            ctx.arc(centerX - 24, torsoY + 38, 22, 0.2, Math.PI * 0.9);
            ctx.stroke();
            // Right Pec
            ctx.beginPath();
            ctx.arc(centerX + 24, torsoY + 38, 22, 0.1, Math.PI * 0.8);
            ctx.stroke();
            // Sternum line
            ctx.beginPath();
            ctx.moveTo(centerX, torsoY + 15);
            ctx.lineTo(centerX, torsoY + 60);
            ctx.stroke();
            ctx.restore();
          }

          // 6-Pack Abs Definition
          if (stage >= 2) {
            ctx.save();
            ctx.strokeStyle = `rgba(120, 53, 15, ${stageConfig.absOpacity})`;
            ctx.lineWidth = 2;
            for (let row = 0; row < 3; row++) {
              let abY = torsoY + 68 + row * 18;
              // Left block
              ctx.strokeRect(centerX - 16, abY, 13, 12);
              // Right block
              ctx.strokeRect(centerX + 3, abY, 13, 12);
            }
            // V-cut Line
            if (stage >= 3) {
              ctx.beginPath();
              ctx.moveTo(centerX - 28, hipY - 15);
              ctx.lineTo(centerX, hipY + 5);
              ctx.lineTo(centerX + 28, hipY - 15);
              ctx.stroke();
            }
            ctx.restore();
          }

          // --- ARMS & SHOULDERS (Biceps & Deltoids) ---
          const bicepRadius = stageConfig.bicepSize;
          const armAngle = isWorkingOut ? Math.sin(time * 3) * 0.4 : 0.1;

          // Left Shoulder & Arm
          ctx.beginPath();
          ctx.arc(centerX - shW, torsoY + 12, bicepRadius + 4, 0, Math.PI * 2);
          ctx.fillStyle = stage === 1 ? '#3b82f6' : '#f5d0c5';
          ctx.fill();
          ctx.stroke();

          // Left Bicep
          ctx.beginPath();
          ctx.ellipse(centerX - shW - 8, torsoY + 45, bicepRadius, bicepRadius * 1.5, armAngle, 0, Math.PI * 2);
          ctx.fillStyle = stage === 1 ? '#3b82f6' : '#d4a373';
          ctx.fill();
          ctx.stroke();

          // Left Forearm
          ctx.beginPath();
          ctx.ellipse(centerX - shW - 10, torsoY + 95, bicepRadius * 0.8, bicepRadius * 1.6, -armAngle, 0, Math.PI * 2);
          ctx.fillStyle = '#f5d0c5';
          ctx.fill();
          ctx.stroke();

          // Right Shoulder & Arm
          ctx.beginPath();
          ctx.arc(centerX + shW, torsoY + 12, bicepRadius + 4, 0, Math.PI * 2);
          ctx.fillStyle = stage === 1 ? '#3b82f6' : '#f5d0c5';
          ctx.fill();
          ctx.stroke();

          // Right Bicep
          ctx.beginPath();
          ctx.ellipse(centerX + shW + 8, torsoY + 45, bicepRadius, bicepRadius * 1.5, -armAngle, 0, Math.PI * 2);
          ctx.fillStyle = stage === 1 ? '#3b82f6' : '#d4a373';
          ctx.fill();
          ctx.stroke();

          // Right Forearm
          ctx.beginPath();
          ctx.ellipse(centerX + shW + 10, torsoY + 95, bicepRadius * 0.8, bicepRadius * 1.6, armAngle, 0, Math.PI * 2);
          ctx.fillStyle = '#f5d0c5';
          ctx.fill();
          ctx.stroke();

          // Hand Wraps (Martial Artist tape)
          if (stage >= 2) {
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(centerX - shW - 16, torsoY + 120, 14, 15);
            ctx.fillRect(centerX + shW + 2, torsoY + 120, 14, 15);
          }

          // --- NECK & TRAPS ---
          ctx.beginPath();
          const trapW = 20 * stageConfig.bodyWidthScale;
          ctx.moveTo(centerX - trapW, neckY);
          ctx.lineTo(centerX + trapW, neckY);
          ctx.lineTo(centerX + 12, torsoY);
          ctx.lineTo(centerX - 12, torsoY);
          ctx.closePath();
          ctx.fillStyle = '#f5d0c5';
          ctx.fill();

          // --- HEAD & FACE ---
          ctx.beginPath();
          ctx.ellipse(centerX, headY, 26, 32, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#fde2e4';
          ctx.fill();
          ctx.stroke();

          // Anime Eyes
          const eyeY = headY - 2;
          if (stageConfig.eyeGlow) {
            // Glowing God Eyes
            ctx.shadowColor = stageConfig.eyeColor;
            ctx.shadowBlur = 12;
            ctx.fillStyle = stageConfig.eyeColor;
            ctx.fillRect(centerX - 14, eyeY, 8, 4);
            ctx.fillRect(centerX + 6, eyeY, 8, 4);
            ctx.shadowBlur = 0;
          } else {
            // Confident Anime Eyes
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(centerX - 10, eyeY, 3.5, 0, Math.PI * 2);
            ctx.arc(centerX + 10, eyeY, 3.5, 0, Math.PI * 2);
            ctx.fill();
          }

          // Determined Mouth
          ctx.beginPath();
          ctx.strokeStyle = '#991b1b';
          ctx.lineWidth = 1.5;
          ctx.moveTo(centerX - 6, headY + 15);
          ctx.lineTo(centerX + 6, headY + 15);
          ctx.stroke();

          // --- SPIKY ANIME HAIR ---
          ctx.fillStyle = stageConfig.hairColor;
          ctx.beginPath();
          ctx.moveTo(centerX - 30, headY - 8);
          ctx.lineTo(centerX - 45, headY - 35);
          ctx.lineTo(centerX - 20, headY - 30);
          ctx.lineTo(centerX - 10, headY - 55);
          ctx.lineTo(centerX + 5, headY - 38);
          ctx.lineTo(centerX + 25, headY - 52);
          ctx.lineTo(centerX + 35, headY - 25);
          ctx.lineTo(centerX + 30, headY - 5);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Level Up Flash Burst Effect
          if (isLevelingUp) {
            ctx.save();
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.sin(time * 8) * 0.5 + 0.5})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
          }

          ctx.restore();
          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
        };
      }, [stage, stageConfig, isWorkingOut, isLevelingUp]);

      return (
        <div className="flex flex-col items-center">
          <div className="relative w-80 h-[430px] rounded-2xl overflow-hidden glass-panel flex items-center justify-center p-2">
            {/* Rank Badge Header */}
            <div className="absolute top-3 left-3 right-3 flex justify-between items-center z-10">
              <span className={`text-xs font-orbitron font-extrabold tracking-wider px-3 py-1 rounded-full bg-slate-950/80 border border-slate-700/80 ${stageConfig.titleColor}`}>
                {stageConfig.rank}
              </span>
              <span className="text-xs font-orbitron font-bold text-amber-400 bg-amber-950/40 border border-amber-500/40 px-2 py-0.5 rounded">
                LVL {level}
              </span>
            </div>

            {/* Canvas Character */}
            <canvas ref={canvasRef} width={320} height={430} className="w-full h-full block" />

            {/* EXP Gauge at bottom */}
            <div className="absolute bottom-3 left-4 right-4 z-10">
              <div className="flex justify-between text-[11px] font-orbitron mb-1 text-slate-300">
                <span>EXP PROGRESS</span>
                <span>{exp} / {maxExp} XP</span>
              </div>
              <div className="w-full bg-slate-900/90 h-2.5 rounded-full overflow-hidden border border-slate-700">
                <div
                  className="h-full bg-gradient-to-r from-cyan-400 via-purple-500 to-amber-400 transition-all duration-500 shadow-[0_0_10px_rgba(56,189,248,0.8)]"
                  style={{ width: `${Math.min(100, (exp / maxExp) * 100)}%` }}
                />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      // LocalStorage Persistence
      const [level, setLevel] = useState(() => parseInt(localStorage.getItem('tf_lvl') || '1'));
      const [exp, setExp] = useState(() => parseInt(localStorage.getItem('tf_exp') || '0'));
      const [streak, setStreak] = useState(() => parseInt(localStorage.getItem('tf_streak') || '1'));
      const [unlockedSkills, setUnlockedSkills] = useState(() => {
        const saved = localStorage.getItem('tf_skills');
        return saved ? JSON.parse(saved) : ['p1', 'p2', 'u1', 'c1', 'l1'];
      });

      // Attribute Stats
      const [stats, setStats] = useState(() => {
        const saved = localStorage.getItem('tf_stats');
        return saved ? JSON.parse(saved) : { push: 15, pull: 10, core: 15, legs: 20 };
      });

      // Active Workout State
      const [activeRoutine, setActiveRoutine] = useState(ROUTINES[0]);
      const [currentExerciseIdx, setCurrentExerciseIdx] = useState(0);
      const [completedSets, setCompletedSets] = useState({});
      const [isResting, setIsResting] = useState(false);
      const [restTime, setRestTime] = useState(60);
      const [isWorkingOut, setIsWorkingOut] = useState(false);
      const [isLevelingUp, setIsLevelingUp] = useState(false);
      const [activeTab, setActiveTab] = useState('workout'); // 'workout' | 'skills' | 'guide'
      const [selectedSkillModal, setSelectedSkillModal] = useState(null);

      // Evolution Stage Calculation
      const maxExpForLevel = level * 250;
      const stage = useMemo(() => {
        if (level < 5) return 1;       // E-Rank
        if (level < 15) return 2;      // C-Rank
        if (level < 30) return 3;      // A-Rank
        return 4;                      // S-Rank
      }, [level]);

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('tf_lvl', level.toString());
        localStorage.setItem('tf_exp', exp.toString());
        localStorage.setItem('tf_streak', streak.toString());
        localStorage.setItem('tf_skills', JSON.stringify(unlockedSkills));
        localStorage.setItem('tf_stats', JSON.stringify(stats));
      }, [level, exp, streak, unlockedSkills, stats]);

      // Rest Timer Countdown
      useEffect(() => {
        let interval = null;
        if (isResting && restTime > 0) {
          interval = setInterval(() => {
            setRestTime(prev => {
              if (prev <= 1) {
                sound.playTimerBeep();
                setIsResting(false);
                return 60;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isResting, restTime]);

      // Gain EXP & Check Level Up
      const addExp = (amount, statType) => {
        sound.playSetComplete();
        setIsWorkingOut(true);
        setTimeout(() => setIsWorkingOut(false), 2000);

        setExp(prevExp => {
          let newExp = prevExp + amount;
          if (newExp >= maxExpForLevel) {
            // Level Up!
            setLevel(prevLvl => prevLvl + 1);
            newExp = newExp - maxExpForLevel;
            sound.playLevelUp();
            setIsLevelingUp(true);
            setTimeout(() => setIsLevelingUp(false), 2500);
          }
          return newExp;
        });

        // Boost attribute stats
        if (statType && stats[statType] !== undefined) {
          setStats(prev => ({
            ...prev,
            [statType]: Math.min(100, prev[statType] + 2)
          }));
        }
      };

      // Toggle Skill Unlock
      const toggleSkillUnlock = (skill) => {
        sound.playClick();
        if (unlockedSkills.includes(skill.id)) {
          setUnlockedSkills(prev => prev.filter(id => id !== skill.id));
        } else {
          setUnlockedSkills(prev => [...prev, skill.id]);
          addExp(skill.exp, null);
        }
      };

      // Complete Set handler
      const handleCompleteSet = (exerciseKey, setNum, statType) => {
        sound.playClick();
        const key = `${exerciseKey}_set_${setNum}`;
        if (!completedSets[key]) {
          setCompletedSets(prev => ({ ...prev, [key]: true }));
          addExp(35, statType);
          setIsResting(true);
          setRestTime(60);
        }
      };

      return (
        <div className="min-h-screen bg-hunter-950 text-slate-100 flex flex-col selection:bg-cyan-500 selection:text-black">
          {/* Top Bar Header */}
          <header className="border-b border-hunter-800/80 bg-hunter-900/60 backdrop-blur-md sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-orbitron font-black text-xl shadow-[0_0_15px_rgba(56,189,248,0.5)]">
                TF
              </div>
              <div>
                <h1 className="font-orbitron font-extrabold text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-300 to-amber-300">
                  TITAN FORGE
                </h1>
                <p className="text-[11px] text-slate-400">ANIME BODYWEIGHT CALISTHENICS RPG</p>
              </div>
            </div>

            {/* Streak & Nav Buttons */}
            <div className="flex items-center space-x-2 sm:space-x-4">

              </div>
              <button

                title="เปิด/ปิดเสียง"

                🔊 SFX
              </button>
            </div>
          </header>

              className={`px-4 py-1.5 rounded-lg text-xs font-bold font-orbitron transition ${
                activeTab === 'workout'

                  : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              ⚔️ DAILY WORKOUT
            </button>
            <button

              className={`px-4 py-1.5 rounded-lg text-xs font-bold font-orbitron transition ${
                activeTab === 'skills'
                  ? 'bg-purple-500/20 text-purple-400 border border-purple-500/50 shadow-[0_0_10px_rgba(192,132,252,0.3)]'
                  : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              🌳 SKILL TREES
            </button>
            <button

              📜 CALISTHENICS GUIDE

          </div>

          {/* Main Layout Grid */}

            {/* Left Column: Character Card & Hunter Stats (4 cols) */}

                <div className="space-y-3">
                  <div>
                    <div className="flex justify-between text-xs mb-1 font-semibold">
                      <span className="text-cyan-400">PUSH POWER (อก/ไหล่)</span>

                      <div className="h-full bg-cyan-400 transition-all duration-300" style={{ width: `${stats.push}%` }} />

                  <div>
                    <div className="flex justify-between text-xs mb-1 font-semibold">

                      <span className="font-mono text-purple-300">{stats.pull} / 100</span>

                {/* Rest Timer Widget */}

                    <p className="text-[11px] font-orbitron text-cyan-300">REST INTERVAL (พักฟื้นเซ็ต)</p>

              </div>
            </div>

            {/* Right Column: Dynamic View (8 cols) */}
            <div className="lg:col-span-8 flex flex-col space-y-6">
              
              {/* TAB 1: WORKOUT SESSION & TRACKER */}
              {activeTab === 'workout' && (
                <div className="space-y-5">

                              <div className="flex items-center gap-2 mb-1">
                                <span className="text-sm">{tree.icon}</span>
                                <span className="text-xs font-orbitron px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                                  {skill.stage}
                                </span>
                                <h3 className="font-bold text-base text-slate-100">{skill.name}</h3>
                              </div>
                              <p className="text-xs text-slate-400 mb-2">{skill.desc}</p>
                              <div className="flex items-center gap-3 text-xs">
                                <span className="text-cyan-400 font-mono font-semibold">เป้าหมาย: {item.sets} เซ็ต x {item.reps}</span>
                                <span className="text-purple-400 font-mono">+{skill.exp} XP / ครั้ง</span>
                              </div>
                            </div>

                            {/* Set Checkboxes / Buttons */}
                            <div className="flex items-center gap-2">
                              {Array.from({ length: item.sets }).map((_, sIdx) => {
                                const setNum = sIdx + 1;
                                const isDone = completedSets[`${exerciseKey}_set_${setNum}`];
                                return (
                                  <button
                                    key={setNum}
                                    onClick={() => handleCompleteSet(exerciseKey, setNum, item.tree)}
                                    className={`px-3 py-2 rounded-xl text-xs font-orbitron font-bold transition flex flex-col items-center min-w-[54px] ${
                                      isDone
                                        ? 'bg-gradient-to-b from-emerald-500 to-teal-600 text-white shadow-[0_0_12px_rgba(16,185,129,0.5)] border border-emerald-400'
                                        : 'bg-hunter-800/90 hover:bg-cyan-500/20 hover:border-cyan-500/60 border border-slate-700 text-slate-300'
                                    }`}
                                  >
                                    <span className="text-[10px]">SET {setNum}</span>
                                    <span>{isDone ? '✓ DONE' : 'GO'}</span>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* TAB 2: SKILL PROGRESSION TREES */}
              {activeTab === 'skills' && (
                <div className="space-y-6">
                  <div className="glass-panel p-5 rounded-2xl">
                    <h2 className="text-lg font-bold font-orbitron text-purple-400 flex items-center gap-2">
                      <span>🌳</span> CALISTHENICS MASTERY ROADMAP
                    </h2>
                    <p className="text-xs text-slate-400 mt-1">
                      คลิกที่ท่าฝึกเพื่อดูเทคนิคการเล่น หรือติ๊กเครื่องหมายเพื่อบันทึกว่าสำเร็จท่านั้นแล้วเพื่อรับ EXP และปลดล็อกระดับ
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {Object.values(SKILL_TREES).map(tree => (
                      <div key={tree.id} className="glass-panel p-5 rounded-2xl border-t-2 border-t-cyan-500">
                        <div className="flex items-center gap-2 mb-4">
                          <span className="text-xl">{tree.icon}</span>
                          <h3 className="font-bold font-orbitron text-sm text-slate-200">{tree.name}</h3>
                        </div>

                        <div className="space-y-2.5">
                          {tree.skills.map((skill, sIdx) => {
                            const isUnlocked = unlockedSkills.includes(skill.id);
                            return (
                              <div
                                key={skill.id}
                                className={`p-3 rounded-xl border transition flex items-center justify-between cursor-pointer ${
                                  isUnlocked
                                    ? 'bg-cyan-950/30 border-cyan-500/40 text-cyan-200'
                                    : 'bg-hunter-900/60 border-slate-800 text-slate-400 hover:border-slate-700'
                                }`}
                                onClick={() => setSelectedSkillModal(skill)}
                              >
                                <div className="flex items-center gap-2.5">
                                  <button
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      toggleSkillUnlock(skill);
                                    }}
                                    className={`w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs transition ${
                                      isUnlocked
                                        ? 'bg-cyan-500 text-slate-950 shadow-[0_0_8px_rgba(56,189,248,0.7)]'
                                        : 'bg-slate-800 border border-slate-700 hover:border-cyan-400'
                                    }`}
                                  >
                                    {isUnlocked ? '✓' : ''}
                                  </button>
                                  <div>
                                    <div className="flex items-center gap-1.5">
                                      <span className="text-xs font-semibold">{skill.name}</span>
                                      <span className="text-[10px] px-1.5 py-0.2 rounded bg-slate-800/80 text-amber-300 font-mono">
                                        {skill.stage}
                                      </span>
                                    </div>
                                    <p className="text-[11px] text-slate-400">{skill.reps}</p>
                                  </div>
                                </div>

                                <span className="text-xs font-mono text-purple-400">+{skill.exp} XP</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: HYPERTROPHY & BODYWEIGHT GUIDE */}
              {activeTab === 'guide' && (
                <div className="space-y-5">
                  <div className="glass-panel p-6 rounded-2xl">
                    <h2 className="text-lg font-bold font-orbitron text-amber-400 mb-3 flex items-center gap-2">
                      <span>📖</span> วิทยาศาสตร์การสร้างกล้ามเนื้อด้วยน้ำหนักตัว (Bodyweight Hypertrophy)
                    </h2>
                    
                    <div className="space-y-4 text-sm text-slate-300 leading-relaxed">
                      <div className="p-4 rounded-xl bg-hunter-800/50 border border-slate-700">
                        <h4 className="font-bold text-cyan-300 text-base mb-1">1. หลักการ Progressive Overload โดยไม่ใช้น้ำหนักเหล็ก</h4>
                        <p className="text-xs text-slate-400">
                          ในบอดี้เวท เราไม่ได้เพิ่มแผ่นเหล็ก แต่เราเปลี่ยน <strong>"มุมองศาและคานงัด (Leverage)"</strong> เช่น จากวิดพื้นบนเข่า -> วิดพื้นมาตรฐาน -> วิดพื้นมือเดียว หรือการปรับความเร็วในการลง (Tempo) ให้ช้าลง 3-4 วินาทีเพื่อเพิ่มแรงตึงของเส้นใยกล้ามเนื้อ (Mechanical Tension)
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-hunter-800/50 border border-slate-700">
                        <h4 className="font-bold text-purple-300 text-base mb-1">2. ช่วงจำนวนครั้งเพื่อสร้างกล้ามเนื้อ (Rep Range for Hypertrophy)</h4>
                        <p className="text-xs text-slate-400">
                          - <strong>Strength (ความแข็งแรง):</strong> 3 - 6 ครั้ง/เซ็ต (ใช้ท่าที่ยากมาก เช่น Muscle-up, Pistol Squat)<br/>
                          - <strong>Hypertrophy (ขยายขนาดกล้ามเนื้อ):</strong> 8 - 15 ครั้ง/เซ็ต โดยครั้งสุดท้ายต้องใกล้เคียงจุดล้า (RPE 8-9)<br/>
                          - <strong>Endurance:</strong> 15 ครั้งขึ้นไป เหมาะกับการวอร์มอัปหรือจบเซ็ตสุดท้าย
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-hunter-800/50 border border-slate-700">
                        <h4 className="font-bold text-amber-300 text-base mb-1">3. พักฟื้นและการกินโปรตีน (Supercompensation)</h4>
                        <p className="text-xs text-slate-400">
                          กล้ามเนื้อไม่ได้โตตอนออกกำลังกาย แต่โตตอนนอนหลับพักผ่อน! แนะนำโปรตีน 1.6 - 2.0 กรัมต่อน้ำหนักตัว (kg) และนอนหลับ 7-8 ชั่วโมง เพื่อให้ตัวละครในชีวิตจริงเติบโตขึ้นตามเลเวลในเกม
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* Skill Detail Modal */}
          {selectedSkillModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="glass-panel max-w-md w-full p-6 rounded-2xl border border-cyan-500/50 shadow-[0_0_30px_rgba(56,189,248,0.3)] animate-float">
                <div className="flex justify-between items-start mb-3">
                  <div>
                    <span className="text-[11px] font-orbitron px-2 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-500/30">
                      {selectedSkillModal.stage}
                    </span>
                    <h3 className="text-xl font-bold text-slate-100 mt-1">{selectedSkillModal.name}</h3>
                  </div>
                  <button
                    onClick={() => setSelectedSkillModal(null)}
                    className="text-slate-400 hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="my-4 space-y-2 text-sm text-slate-300">
                  <p><strong className="text-cyan-400">วิธีปฏิบัติ:</strong> {selectedSkillModal.desc}</p>
                  <p><strong className="text-purple-400">เกณฑ์การผ่าน:</strong> {selectedSkillModal.reps}</p>
                  <p><strong className="text-amber-400">รางวัลค่าประสบการณ์:</strong> +{selectedSkillModal.exp} EXP</p>
                </div>

                <div className="mt-5 flex gap-2">
                  <button
                    onClick={() => {
                      toggleSkillUnlock(selectedSkillModal);
                      setSelectedSkillModal(null);
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 font-orbitron font-bold text-xs text-slate-950 hover:brightness-110 transition"
                  >
                    {unlockedSkills.includes(selectedSkillModal.id) ? 'ทำเครื่องหมายว่ายังไม่ผ่าน' : 'บันทึกว่าสำเร็จท่านี้แล้ว ✓'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-hunter-800/60 py-4 text-center text-xs text-slate-500">
            TITAN FORGE RPG © 2026 — Bodyweight Calisthenics Mastery System
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
