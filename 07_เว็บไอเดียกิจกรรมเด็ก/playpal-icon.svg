<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#FFFDF9"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Cheerful Balloon & Sparkles -->
  <!-- Balloon Body -->
  <ellipse cx="256" cy="210" rx="120" ry="140" fill="#FFFFFF" opacity="0.95"/>
  <!-- Highlight -->
  <ellipse cx="210" cy="160" rx="30" ry="45" transform="rotate(-25 210 160)" fill="#FFFFFF" opacity="0.6"/>
  <!-- Balloon Knot -->
  <polygon points="256,345 240,365 272,365" fill="#FFFFFF" opacity="0.95"/>
  <!-- String -->
  <path d="M 256,365 Q 240,400 265,430 T 256,470" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

  <!-- Face on Balloon (Cute Smiley Face) -->
  <circle cx="215" cy="205" r="14" fill="#FF6B6B"/>
  <circle cx="297" cy="205" r="14" fill="#FF6B6B"/>
  <path d="M 225,240 Q 256,275 287,240" fill="none" stroke="#FF6B6B" stroke-width="12" stroke-linecap="round"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="190" cy="235" rx="16" ry="10" fill="#FFD166" opacity="0.8"/>
  <ellipse cx="322" cy="235" rx="16" ry="10" fill="#FFD166" opacity="0.8"/>

  <!-- Playful Stars/Sparkles -->
  <text x="75" y="140" font-size="52" fill="#FFFFFF" opacity="0.85">✨</text>
  <text x="385" y="150" font-size="44" fill="#FFFFFF" opacity="0.85">⭐</text>
  <text x="360" y="360" font-size="48" fill="#FFFFFF" opacity="0.85">🎈</text>
</svg>
