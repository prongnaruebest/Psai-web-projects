<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orbital Survivor" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Orbital Survivor — High-tech Sci-Fi Survival Roguelite Web Action Game." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Orbital Survivor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-touch-callout: none;
      html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050913; }
      body {
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        touch-action: none;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
